MEMORY {
 ROM0: start=$8000, size=$2000, file=%O, fill=yes, fillval=$ff;
 ROM1: start=$8000, size=$2000, file=%O, fill=yes, fillval=$ff;
 ROM2: start=$8000, size=$2000, file=%O, fill=yes, fillval=$ff;
 ROM3: start=$8000, size=$2000, file=%O, fill=yes, fillval=$ff;
 ROM4: start=$8000, size=$2000, file=%O, fill=yes, fillval=$ff;
 ROM5: start=$8000, size=$2000, file=%O, fill=yes, fillval=$ff;
 ROM6: start=$8000, size=$2000, file=%O, fill=yes, fillval=$ff;
 ROM7: start=$8000, size=$2000, file=%O, fill=yes, fillval=$ff;
 # Editor state owns $03CC-$03FF; its text buffer owns $0A60-$0AFF.
 FUTURE: start=$0334, size=$0098, file="";
 GATE: start=$0800, size=$0260, file="";
 RESIDENT: start=$1400, size=$1800, file="";
 RT: start=$e400, size=$1bfa, file="";
}
SEGMENTS {
 HEADER: load=ROM0, type=ro;
 COMMAND: load=ROM0, type=ro;
 GATEWAY: load=ROM0, run=GATE, type=ro, define=yes;
 SERVICE_GATEWAY: load=ROM0, run=FUTURE, type=ro, define=yes;
 HEADER1: load=ROM1, type=ro;
 COMPILER: load=ROM1, run=RESIDENT, type=ro, define=yes;
 HEADER2: load=ROM2, type=ro;
 RUNTIME: load=ROM2, run=RT, type=ro, define=yes;
 SERVICES: load=ROM2, type=ro, define=yes;
 HEADER3: load=ROM3, type=ro;
 SCREEN_EDITOR: load=ROM3, type=ro, define=yes;
 HEADER4: load=ROM4, type=ro;
 BINARY_EDITOR: load=ROM4, type=ro, define=yes;
 HEADER5: load=ROM5, type=ro;
 BINARY_STORAGE: load=ROM5, type=ro, define=yes;
 HEADER6: load=ROM6, type=ro;
 HEADER7: load=ROM7, type=ro;
}
