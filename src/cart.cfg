MEMORY {
 ROM0: start=$8000, size=$2000, file=%O, fill=yes, fillval=$ff;
 ROM1: start=$a000, size=$2000, file=%O, fill=yes, fillval=$ff;
 GATE: start=$0800, size=$0300, file="";
 RESIDENT: start=$1400, size=$1800, file="%O.compiler";
 RT: start=$e400, size=$1bfa, file="%O.runtime";
}
SEGMENTS {
 HEADER: load=ROM0, type=ro;
 COMMAND: load=ROM0, type=ro;
 GATEWAY: load=ROM0, run=GATE, type=ro, define=yes;
 RECOVERY: load=ROM1, type=ro;
 COMPILER: load=RESIDENT, type=ro, define=yes;
 COMPILER_PACKED0: load=ROM0, type=ro;
 COMPILER_PACKED: load=ROM1, type=ro;
 RUNTIME: load=RT, type=ro, define=yes;
 PACKED: load=ROM1, type=ro;
}
